<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RunLume: local-first analytics for AI coding sessions</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="app-header">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path d="M7 22.5V17m9 5.5V10m9 12.5V6" />
        </svg>
      </span>
      <div class="wordmark">
        <h1>RunLume</h1>
        <span class="eyebrow">Agent intelligence</span>
      </div>
    </div>
    <div class="header-context" aria-hidden="true">
      <span>Workspace</span>
      <strong>Overview</strong>
    </div>
    <div id="seg" role="tablist" aria-label="Agent source"></div>
    <div class="local-status">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong>Local only</strong>
        <span id="roots" role="status" aria-live="polite">scanning…</span>
      </div>
    </div>
    <button type="button" id="wrapped-btn" class="hbtn" title="Replay this reporting window">Replay</button>
    <button type="button" id="refresh" class="hbtn" title="Rescan session files">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
        <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Refresh</span>
    </button>
  </header>
  <div class="layout">
    <main id="main" tabindex="-1">
      <div class="loading-shell" aria-hidden="true">
        <div class="loading-hero skeleton"></div>
        <div class="loading-cards">
          <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
        </div>
        <div class="loading-panel skeleton"></div>
      </div>
    </main>
  </div>
  <div id="tooltip" role="presentation"></div>
  <script src="app.js"></script>
</body>
</html>
