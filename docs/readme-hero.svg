<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">RunLume</title>
  <desc id="desc">Local-first analytics for AI coding sessions with cost, code impact, and workflow cards.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1320" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102a43" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="36" fill="url(#bg)"/>
  <circle cx="1260" cy="70" r="180" fill="#dbeafe" opacity=".62"/>
  <circle cx="108" cy="500" r="130" fill="#e8f2ff" opacity=".9"/>
  <g transform="translate(84 78)">
    <g aria-hidden="true">
      <rect width="58" height="58" rx="16" fill="#1d1d1f"/>
      <rect x="12" y="34" width="8" height="13" rx="3" fill="#ffffff"/>
      <rect x="25" y="23" width="8" height="24" rx="3" fill="#76b9ff"/>
      <rect x="38" y="11" width="8" height="36" rx="3" fill="#2997ff"/>
    </g>
    <text x="78" y="44" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="720" letter-spacing="-1.5">RunLume</text>
    <text x="0" y="145" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="720" letter-spacing="-2.4">See what your coding</text>
    <text x="0" y="211" fill="url(#blue)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="720" letter-spacing="-2.4">agents actually did.</text>
    <text x="0" y="263" fill="#5f6368" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Cost · code impact · workflow · providers · timelines</text>
    <g transform="translate(0 310)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600">
      <rect width="138" height="42" rx="21" fill="#ffffff" stroke="#d9e2ec"/>
      <circle cx="24" cy="21" r="6" fill="#12805c"/>
      <text x="40" y="27" fill="#334155">Local only</text>
      <g transform="translate(152)">
        <rect width="140" height="42" rx="21" fill="#ffffff" stroke="#d9e2ec"/>
        <path d="M22 15v12m-6-6h12" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
        <text x="40" y="27" fill="#334155">Read only</text>
      </g>
      <g transform="translate(306)">
        <rect width="202" height="42" rx="21" fill="#ffffff" stroke="#d9e2ec"/>
        <text x="20" y="27" fill="#334155">0 runtime dependencies</text>
      </g>
    </g>
  </g>
  <g transform="translate(760 90)" filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="556" height="380" rx="28" fill="#ffffff" stroke="#e4e7eb"/>
    <g transform="translate(30 28)">
      <text x="0" y="18" fill="#6e6e73" font-size="15" font-weight="650" letter-spacing=".7">OBSERVED WINDOW</text>
      <text x="0" y="56" fill="#1d1d1f" font-size="26" font-weight="700">Agent activity, normalized</text>
      <g transform="translate(0 90)">
        <rect width="154" height="116" rx="18" fill="#f5f7fa"/>
        <text x="18" y="27" fill="#6e6e73" font-size="14">API equivalent</text>
        <text x="18" y="65" fill="#1d1d1f" font-size="30" font-weight="720">$18.42</text>
        <text x="18" y="92" fill="#12805c" font-size="13" font-weight="650">94% priced</text>
      </g>
      <g transform="translate(171 90)">
        <rect width="154" height="116" rx="18" fill="#f5f7fa"/>
        <text x="18" y="27" fill="#6e6e73" font-size="14">Code impact</text>
        <text x="18" y="65" fill="#1d1d1f" font-size="30" font-weight="720">+2.8k</text>
        <text x="18" y="92" fill="#0066cc" font-size="13" font-weight="650">41 files touched</text>
      </g>
      <g transform="translate(342 90)">
        <rect width="154" height="116" rx="18" fill="#f5f7fa"/>
        <text x="18" y="27" fill="#6e6e73" font-size="14">Workflow</text>
        <text x="18" y="65" fill="#1d1d1f" font-size="30" font-weight="720">7.2%</text>
        <text x="18" y="92" fill="#a15c00" font-size="13" font-weight="650">rework rate</text>
      </g>
      <g transform="translate(0 238)">
        <text x="0" y="14" fill="#6e6e73" font-size="14">Activity</text>
        <line x1="0" y1="86" x2="496" y2="86" stroke="#e5e7eb"/>
        <g fill="#a8d3ff">
          <rect x="6" y="55" width="24" height="31" rx="5"/><rect x="43" y="34" width="24" height="52" rx="5"/>
          <rect x="80" y="46" width="24" height="40" rx="5"/><rect x="117" y="20" width="24" height="66" rx="5"/>
          <rect x="154" y="39" width="24" height="47" rx="5"/><rect x="191" y="8" width="24" height="78" rx="5"/>
          <rect x="228" y="30" width="24" height="56" rx="5"/><rect x="265" y="18" width="24" height="68" rx="5"/>
          <rect x="302" y="45" width="24" height="41" rx="5"/><rect x="339" y="27" width="24" height="59" rx="5"/>
          <rect x="376" y="10" width="24" height="76" rx="5"/><rect x="413" y="33" width="24" height="53" rx="5"/>
          <rect x="450" y="16" width="24" height="70" rx="5" fill="#2997ff"/>
        </g>
      </g>
    </g>
  </g>
</svg>
